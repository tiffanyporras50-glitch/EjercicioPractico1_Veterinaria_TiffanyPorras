<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org"
      th:replace="~{layout/base :: pagina(~{::title}, ~{::main})}">
<head>
    <title>Servicios | Clínica Veterinaria Huellitas</title>
</head>
<body>
<main class="container py-4 flex-grow-1">

    <div class="d-flex justify-content-between align-items-center mb-4">
        <h2 class="titulo-seccion mb-0">Servicios veterinarios</h2>
        <a th:href="@{/servicios/nuevo}" class="btn btn-principal">
            <i class="bi bi-plus-circle"></i> Agregar servicio
        </a>
    </div>

    <div class="table-responsive shadow-sm rounded">
        <table class="table table-hover align-middle mb-0 tabla-vet">
            <thead>
                <tr>
                    <th>Nombre</th>
                    <th>Tipo</th>
                    <th class="text-end">Precio</th>
                    <th class="text-center">Duración</th>
                    <th class="text-end">Acciones</th>
                </tr>
            </thead>
            <tbody class="bg-white">
                <tr th:each="servicio : ${servicios}">
                    <td class="fw-semibold" th:text="${servicio.nombre}">Nombre</td>
                    <td><span class="badge text-bg-light border" th:text="${servicio.tipoServicio.nombre}">Tipo</span></td>
                    <td class="text-end"
                        th:text="'₡' + ${#numbers.formatDecimal(servicio.precio, 1, 'POINT', 2, 'COMMA')}">₡0,00</td>
                    <td class="text-center" th:text="${servicio.duracionMinutos} + ' min'">0 min</td>
                    <td class="text-end">
                        <a th:href="@{/servicios/editar/{id}(id=${servicio.id})}"
                           class="btn btn-sm btn-outline-primary">
                            <i class="bi bi-pencil-square"></i> Editar
                        </a>
                        <button type="button" class="btn btn-sm btn-outline-danger"
                                data-bs-toggle="modal"
                                th:attr="data-bs-target='#modalEliminarServicio' + ${servicio.id}">
                            <i class="bi bi-trash"></i> Eliminar
                        </button>
                    </td>
                </tr>
                <tr th:if="${#lists.isEmpty(servicios)}">
                    <td colspan="5" class="text-center text-muted py-4">No hay servicios registrados.</td>
                </tr>
            </tbody>
        </table>
    </div>

    <!-- Un modal de confirmación por cada servicio -->
    <div th:each="servicio : ${servicios}" class="modal fade"
         th:id="'modalEliminarServicio' + ${servicio.id}" tabindex="-1">
        <div class="modal-dialog modal-dialog-centered">
            <div class="modal-content">
                <div class="modal-header bg-danger text-white">
                    <h5 class="modal-title"><i class="bi bi-exclamation-triangle"></i> Confirmar eliminación</h5>
                    <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body">
                    ¿Seguro que deseas eliminar el servicio <strong th:text="${servicio.nombre}">Nombre</strong>?
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancelar</button>
                    <form th:action="@{/servicios/eliminar}" method="post">
                        <input type="hidden" name="id" th:value="${servicio.id}">
                        <button type="submit" class="btn btn-danger">Sí, eliminar</button>
                    </form>
                </div>
            </div>
        </div>
    </div>

</main>
</body>
</html>
