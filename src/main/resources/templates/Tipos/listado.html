<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org"
      th:replace="~{layout/base :: pagina(~{::title}, ~{::main})}">
<head>
    <title>Tipos de servicio | Clínica Veterinaria Huellitas</title>
</head>
<body>
<main class="container py-4 flex-grow-1">

    <div class="d-flex justify-content-between align-items-center mb-4">
        <h2 class="titulo-seccion mb-0">Tipos de servicio</h2>
        <a th:href="@{/tipos/nuevo}" class="btn btn-principal">
            <i class="bi bi-plus-circle"></i> Agregar tipo
        </a>
    </div>

    <div class="table-responsive shadow-sm rounded">
        <table class="table table-hover align-middle mb-0 tabla-vet">
            <thead>
                <tr>
                    <th>Nombre</th>
                    <th>Descripción</th>
                    <th class="text-center">Cantidad de servicios</th>
                    <th class="text-end">Acciones</th>
                </tr>
            </thead>
            <tbody class="bg-white">
                <tr th:each="tipo : ${tipos}">
                    <td class="fw-semibold" th:text="${tipo.nombre}">Nombre</td>
                    <td th:text="${tipo.descripcion}">Descripción</td>
                    <td class="text-center">
                        <span class="badge rounded-pill text-bg-info fs-6"
                              th:text="${tipo.servicios.size()}">0</span>
                    </td>
                    <td class="text-end">
                        <a th:href="@{/tipos/editar/{id}(id=${tipo.id})}"
                           class="btn btn-sm btn-outline-primary">
                            <i class="bi bi-pencil-square"></i> Editar
                        </a>
                        <button type="button" class="btn btn-sm btn-outline-danger"
                                data-bs-toggle="modal"
                                th:attr="data-bs-target='#modalEliminarTipo' + ${tipo.id}">
                            <i class="bi bi-trash"></i> Eliminar
                        </button>
                    </td>
                </tr>
                <tr th:if="${#lists.isEmpty(tipos)}">
                    <td colspan="4" class="text-center text-muted py-4">No hay tipos de servicio registrados.</td>
                </tr>
            </tbody>
        </table>
    </div>

    <!-- Un modal de confirmación por cada tipo -->
    <div th:each="tipo : ${tipos}" class="modal fade"
         th:id="'modalEliminarTipo' + ${tipo.id}" tabindex="-1">
        <div class="modal-dialog modal-dialog-centered">
            <div class="modal-content">
                <div class="modal-header bg-danger text-white">
                    <h5 class="modal-title"><i class="bi bi-exclamation-triangle"></i> Confirmar eliminación</h5>
                    <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body">
                    ¿Seguro que deseas eliminar el tipo <strong th:text="${tipo.nombre}">Nombre</strong>?
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancelar</button>
                    <form th:action="@{/tipos/eliminar}" method="post">
                        <input type="hidden" name="id" th:value="${tipo.id}">
                        <button type="submit" class="btn btn-danger">Sí, eliminar</button>
                    </form>
                </div>
            </div>
        </div>
    </div>

</main>
</body>
</html>
