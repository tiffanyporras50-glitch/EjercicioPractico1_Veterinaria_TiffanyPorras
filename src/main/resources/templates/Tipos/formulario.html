<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org"
      th:replace="~{layout/base :: pagina(~{::title}, ~{::main})}">
<head>
    <title>Tipo de servicio | Clínica Veterinaria Huellitas</title>
</head>
<body>
<main class="container py-4 flex-grow-1">

    <div class="row justify-content-center">
        <div class="col-md-7 col-lg-6">
            <div class="card tarjeta-info p-4">
                <h2 class="titulo-seccion mb-4"
                    th:text="${tipoServicio.id == null} ? 'Agregar tipo de servicio' : 'Editar tipo de servicio'">
                    Tipo de servicio
                </h2>

                <form th:action="@{/tipos/guardar}" th:object="${tipoServicio}" method="post">
                    <input type="hidden" th:field="*{id}">

                    <div class="mb-3">
                        <label for="nombre" class="form-label">Nombre</label>
                        <input type="text" class="form-control" th:field="*{nombre}"
                               maxlength="100" required>
                    </div>

                    <div class="mb-4">
                        <label for="descripcion" class="form-label">Descripción</label>
                        <textarea class="form-control" th:field="*{descripcion}"
                                  rows="3" maxlength="255"></textarea>
                    </div>

                    <div class="d-flex justify-content-end gap-2">
                        <a th:href="@{/tipos}" class="btn btn-secondary">Cancelar</a>
                        <button type="submit" class="btn btn-principal">
                            <i class="bi bi-save"></i> Guardar
                        </button>
                    </div>
                </form>
            </div>
        </div>
    </div>

</main>
</body>
</html>
