<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org"
      th:fragment="pagina(titulo, contenido)">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title th:replace="${titulo}">Clínica Veterinaria</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <link th:href="@{/css/estilos.css}" rel="stylesheet">
</head>
<body class="d-flex flex-column min-vh-100">

    <header th:replace="~{layout/fragmentos :: encabezado}"></header>
    <nav th:replace="~{layout/fragmentos :: menu}"></nav>
    <div th:replace="~{layout/fragmentos :: mensajes}"></div>

    <main th:replace="${contenido}"></main>

    <footer th:replace="~{layout/fragmentos :: pie}"></footer>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        // Muestra automáticamente los toasts que vengan del controlador
        document.querySelectorAll('.toast').forEach(function (toast) {
            new bootstrap.Toast(toast, { delay: 4000 }).show();
        });
    </script>
</body>
</html>
